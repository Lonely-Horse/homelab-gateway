listen: "0.0.0.0:1314"

timeouts:                        # B 侧：网关 → 上游
  dial: 3s
  response_header: 10s
  idle: 90s                      # Transport.IdleConnTimeout

server:                          # A 侧：客户端 → 网关
  read_header: 5s
  write: 30s
  idle: 90s

routes:
  - name: blog
    host: blog.example.com
    upstream: "http://127.0.0.1:8080"
    health: "/healthz"

  - name: grafana
    path_prefix: "/grafana/"
    upstream: "http://127.0.0.1:3000"
    strip_prefix: true
    health: "/api/health"